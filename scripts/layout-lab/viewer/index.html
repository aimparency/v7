<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layout rating</title>
<style>
:root {
  color-scheme: dark;
  --background: #131313;
  --panel: #1e1e1e;
  --line: #333;
  --text: #ddd;
  --muted: #888;
  --accent: #40abbf;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--text); font: 14px system-ui, sans-serif; }
button {
  background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; font: inherit; cursor: pointer;
  &:hover { border-color: var(--muted); }
  &.chosen { background: var(--accent); border-color: var(--accent); color: #000; }
}
header {
  position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 8px 16px;
  background: var(--panel); border-bottom: 1px solid var(--line);
  & h1 { font-size: inherit; margin: 0; }
  & .dots { display: flex; gap: 4px; }
  & .dot { width: 22px; height: 22px; padding: 0; border-radius: 50%; font-size: 11px;
    &.done { border-color: var(--accent); }
    &.current { background: var(--line); }
  }
  & .spacer { flex: 1; }
}
main, #projects { display: flex; flex-direction: column; gap: 16px; }
main { padding: 8px 16px 32px; }
.hint { color: var(--muted); }
.project {
  display: flex; flex-direction: column; gap: 6px;
  & .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  & .name { font-weight: 600; margin-right: auto; }
  & .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; height: 42vh; }
  &.expanded .panes { height: calc(100vh - 140px); }
}
.pane {
  position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: var(--background); touch-action: none; cursor: grab;
  & canvas, & svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  & svg { pointer-events: none; }
  & svg.hidden { display: none; }
  & .side { position: absolute; left: 8px; top: 6px; color: var(--muted); pointer-events: none; }
}
.overall {
  display: flex; flex-direction: column; gap: 8px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  & .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  & textarea { width: 100%; min-height: 80px; background: var(--background); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: inherit; }
}
dialog {
  width: min(800px, calc(100vw - 32px)); background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  & textarea { width: 100%; height: 50vh; background: var(--background); color: var(--text); border: 1px solid var(--line); font: 12px monospace; }
  & .bar { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
}
@media (max-width: 700px) {
  .project .panes { grid-template-columns: 1fr; height: 80vh; }
}
</style>
</head>
<body>
<header>
  <h1>Layout rating</h1>
  <span id="position" class="hint"></span>
  <div id="dots" class="dots"></div>
  <span class="spacer"></span>
  <button id="previous">← Previous</button>
  <button id="next">Next →</button>
  <button id="report">Report</button>
</header>
<main>
  <p class="hint">Same projects, two layout settings. Drag to pan, scroll to zoom (both sides follow), double-click to fit. Pick the nicer side per project, then overall, and say why.</p>
  <div id="projects"></div>
  <section class="overall">
    <div class="bar">
      <strong>Overall</strong>
      <span id="overall"></span>
    </div>
    <textarea id="why" placeholder="Why? What looks better or worse: long important connections, clutter, crossings, gaps, balance…"></textarea>
  </section>
</main>
<dialog id="report-dialog">
  <p>Paste this into the chat.</p>
  <textarea id="report-text" readonly></textarea>
  <div class="bar">
    <button id="copy">Copy</button>
    <button id="close">Close</button>
  </div>
</dialog>
<script type="module" src="./main.ts"></script>
</body>
</html>
